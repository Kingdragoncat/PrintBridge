[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB

; upload over UART header (TX=43, RX=44) with an external USB-serial adapter
upload_speed = 921600
monitor_speed = 115200

; the devkitc board defaults to USB_MODE=1 (CDC/JTAG) which locks
; the USB peripheral into device mode. we need mode 0 (TinyUSB/OTG)
; so we can use USB Host to talk to the printer.
; CDC_ON_BOOT=0 because the USB port goes to the printer, not serial.
build_unflags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=0

build_flags = 
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    fastled/FastLED @ ^3.6.0
