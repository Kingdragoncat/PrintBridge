worker_processes 1;

events {
    worker_connections 1024;
}

# TCP Stream Proxy for RAW JetDirect (Port 9100)
stream {
    server {
        listen 9100;
        proxy_pass 192.168.18.52:9100;
        proxy_timeout 1h;
        proxy_connect_timeout 5s;
    }
}

# HTTP Reverse Proxy for Web Dashboard & REST API (Port 9101)
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Allow large document uploads to print (up to 100MB)
    client_max_body_size 100M;

    server {
        listen 9101;

        location / {
            proxy_pass http://192.168.18.52:9101;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
